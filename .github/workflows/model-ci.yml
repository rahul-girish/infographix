name: Model & Inference CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: model-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MPLCONFIGDIR: /tmp/matplotlib
      UV_VENV_CLEAR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install CPU PyTorch & service/test dependencies
        run: |
          uv venv --clear .venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          uv pip install -r inference_service/requirements.txt
          uv pip install matplotlib

      - name: Run feature engineering unit tests
        run: .venv/bin/python -m unittest discover -s tests/features -v

      - name: Run ClearML registry, Stage 3, & inference service tests
        run: |
          .venv/bin/python -m unittest \
            src/test_clearml_registry.py \
            src/test_stage3_pipeline.py \
            inference_service/tests/test_inference_service.py \
            -v

      - name: Run local model registry test
        run: .venv/bin/python src/test_model_registry.py

      - name: Run Stage B neural model tests
        run: .venv/bin/python -m unittest src/test_neural_model_stage_b.py -v

  docker-build-check:
    name: Inference Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inference_service Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
