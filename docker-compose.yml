services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: infographix_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - API_V1_STR=/api/v1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
